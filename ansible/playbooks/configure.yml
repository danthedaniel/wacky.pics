- name: Configure wacky.pics server
  hosts: wacky
  remote_user: root

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted

    - name: Daemon reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart wacky-pics
      ansible.builtin.systemd:
        name: wacky-pics
        state: restarted

  tasks:
    # --- Packages ---

    # nginx.org repo, since Debian stable lags on security fixes. Must come
    # before system packages: python3-certbot-nginx depends on nginx.
    - name: Add nginx.org signing key
      ansible.builtin.get_url:
        url: https://nginx.org/keys/nginx_signing.key
        dest: /etc/apt/keyrings/nginx.asc
        mode: "0644"

    - name: Add nginx.org apt source
      ansible.builtin.copy:
        content: |
          Types: deb
          URIs: https://nginx.org/packages/debian
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: nginx
          Signed-By: /etc/apt/keyrings/nginx.asc
        dest: /etc/apt/sources.list.d/nginx.sources
        mode: "0644"

    - name: Install latest nginx from nginx.org
      ansible.builtin.apt:
        name: nginx
        state: latest
        update_cache: true
      notify: Restart nginx

    - name: Install system packages
      ansible.builtin.apt:
        name: "{{ system_packages }}"
        state: present

    # --- Users ---

    - name: Create web user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true

    - name: Ensure uploads directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/uploads"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    # --- SSH ---

    - name: Deploy sshd_config
      ansible.builtin.template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0644"
        validate: "sshd -t -f %s"
      notify: Restart sshd

    # --- UFW ---

    - name: Set UFW default deny incoming
      community.general.ufw:
        direction: incoming
        default: deny

    - name: Set UFW default allow outgoing
      community.general.ufw:
        direction: outgoing
        default: allow

    - name: Allow UFW ports
      community.general.ufw:
        rule: allow
        port: "{{ item.port | string }}"
        proto: "{{ item.proto }}"
      loop: "{{ ufw_allowed_ports }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # --- Unattended upgrades ---

    - name: Enable auto-upgrades
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"

    # --- Bun ---

    - name: Install bun for web user
      ansible.builtin.shell: curl -fsSL https://bun.sh/install | bash -s "bun-v{{ bun_version }}"
      args:
        creates: "{{ bun_path }}"
      become: true
      become_user: "{{ app_user }}"

    # --- Nginx ---

    # nginx.org's nginx.conf only includes conf.d/, so the site lives there.
    # The sites-* paths are leftovers from the Debian package.
    - name: Remove default and legacy nginx site configs
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/conf.d/default.conf
        - /etc/nginx/sites-enabled/default
        - "/etc/nginx/sites-enabled/{{ domain_name }}"
        - "/etc/nginx/sites-available/{{ domain_name }}"
      notify: Reload nginx

    - name: Check if SSL cert exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
      register: ssl_cert

    - name: Deploy nginx site config
      ansible.builtin.template:
        src: wacky.pics.j2
        dest: "/etc/nginx/conf.d/{{ domain_name }}.conf"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Validate nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    # --- Systemd ---

    - name: Deploy wacky-pics systemd service
      ansible.builtin.template:
        src: wacky-pics.service.j2
        dest: /etc/systemd/system/wacky-pics.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Daemon reload
        - Restart wacky-pics

    - name: Enable and start wacky-pics service
      ansible.builtin.systemd:
        name: wacky-pics
        enabled: true
        state: started

    # --- Certbot ---

    - name: Check if SSL cert directory exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ domain_name }}"
      register: certbot_cert

    - name: Obtain SSL certificate with certbot
      ansible.builtin.command: >-
        certbot --nginx
        -d {{ domain_name }}
        --non-interactive
        --agree-tos
        {{ ('-m ' + certbot_email) if certbot_email else '--register-unsafely-without-email' }}
      when: not certbot_cert.stat.exists

    - name: Ensure certbot renewal timer is enabled
      ansible.builtin.systemd:
        name: certbot.timer
        enabled: true
        state: started

    # --- Cron ---

    - name: Add cleanup cron job for web user
      ansible.builtin.cron:
        name: "wacky.pics cleanup old uploads"
        minute: "0"
        hour: "4"
        job: "/usr/bin/bash {{ app_dir }}/cleanup.sh"
        user: "{{ app_user }}"
