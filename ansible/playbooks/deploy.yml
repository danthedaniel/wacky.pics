- name: Deploy wacky.pics app
  hosts: wacky
  remote_user: root

  handlers:
    - name: Restart wacky-pics
      ansible.builtin.systemd:
        name: wacky-pics
        state: restarted

  tasks:
    - name: Sync app code to server
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ app_dir }}/"
        delete: true
        rsync_opts:
          - "--filter=':- .gitignore'"
          - "--exclude=.git/"
          - "--exclude=ansible/"
          - "--exclude=scripts/"
      become: true
      become_user: "{{ app_user }}"
      notify: Restart wacky-pics

    - name: Get installed bun version
      ansible.builtin.command: "{{ bun_path }} --version"
      become: true
      become_user: "{{ app_user }}"
      register: bun_installed
      changed_when: false
      failed_when: false

    - name: Install bun {{ bun_version }}
      ansible.builtin.shell: curl -fsSL https://bun.sh/install | bash -s "bun-v{{ bun_version }}"
      become: true
      become_user: "{{ app_user }}"
      when: bun_installed.stdout != bun_version
      notify: Restart wacky-pics

    - name: Install bun dependencies
      ansible.builtin.command: "{{ bun_path }} install --frozen-lockfile"
      args:
        chdir: "{{ app_dir }}"
      become: true
      become_user: "{{ app_user }}"
      register: bun_install
      changed_when: "'(no changes)' not in bun_install.stdout"
