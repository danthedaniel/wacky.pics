app_user: web
app_dir: "/home/{{ app_user }}/app"
bun_path: "/home/{{ app_user }}/.bun/bin/bun"
bun_version: "{{ (lookup('file', inventory_dir + '/../../package.json') | from_json).packageManager | regex_replace('^bun@', '') }}"
app_port: 3000
max_upload_size_mib: 128
system_packages:
  - htop
  - vim
  - sudo
  - unattended-upgrades
  - rsync
  - unzip
  - certbot
  - python3-certbot-nginx
  - ufw
ufw_allowed_ports:
  - { port: 22, proto: tcp }
  - { port: 80, proto: tcp }
  - { port: 443, proto: tcp }
